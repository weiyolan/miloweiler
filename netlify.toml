# example netlify.toml
[build]
  command = "next build"
  functions = "netlify/functions"
  publish = ".next"
  
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long browser cache for static files in /public (the HTML itself stays max-age=0).
# Fonts never change under the same name → 1 year. Images in /public/images are not content-hashed,
# so they get 30 days (+ revalidate in the background) in case one is replaced under the same name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://docs.netlify.com/configure-builds/file-based-configuration/
